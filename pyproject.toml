[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ncc"
version = "0.1.0"
description = "Nowcast du PIB trimestriel canadien : AR, bridge PIB mensuel, facteurs LCDMA, elastic net et forêt aléatoire, en pseudo temps réel avec délais de publication déclarés."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "pyarrow>=15",
  "typer>=0.12",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ncc = "ncc.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/07-nowcast-canada"

[tool.hatch.build.targets.wheel]
packages = ["src/ncc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
